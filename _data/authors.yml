# Autores do blog. Artigo sem "author:" usa equipe-yarda.
# Os campos name, picture e uri também alimentam os dados estruturados (Schema.org).
# Para dar mais autoridade aos artigos (E-E-A-T do Google), cadastre pessoas reais
# com nome, cargo, foto e link do LinkedIn, e use "author: <chave>" no artigo.
equipe-yarda:
  name: Equipe yarda
  tipo: Organization   # pessoas reais: Person
  cargo: Crescimento com tecnologia e IA para PMEs
  bio: A yarda encontra o gargalo que mais pesa na sua PME e constrói o que resolve: site, atendimento com IA, automação, CRM ou painel.
  picture: /assets/img/monograma-coral.svg
  uri: https://yarda.digital/
